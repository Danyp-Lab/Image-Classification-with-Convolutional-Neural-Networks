[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-classification-cnn"
version = "1.0.0"
description = "Image classification pipelines with Convolutional Neural Networks (CNNs)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
